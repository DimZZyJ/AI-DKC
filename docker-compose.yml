version: '3.8'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.2:3b &&
      ollama pull nomic-embed-text-v2-moe &&
      ollama pull bge-m3 &&
      ollama pull qwen2.5:7b-instruct &&
      wait
      "

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=yourpassword
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=jszip,mammoth,pdf-parse
      # n8n 2.x по умолчанию разрешает Read/Write Files только ~/.n8n-files.
      # Добавляем /files, куда смонтирована папка docs (см. volumes ниже).
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files;/files
      #- PYTHONPATH=/opt/venv/lib/python3.12/site-packages
    volumes:
      - ./data/n8n:/home/node/.n8n
      # Папка с файлами для воркфлоу FolderToExtractorQueue.
      # Host-путь можно задать через DOCS_FOLDER (по умолчанию ./files).
      - ${DOCS_FOLDER:-./files}:/files:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  postgres:
    #image: postgres:17
    image: pgvector/pgvector:pg17
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=88888888
      - POSTGRES_USER=postgres
      - POSTGRES_DB=n8ndb

  adminer:
    image: adminer
    restart: always
    ports:
      - :8080

  # ---------------------------------------------------------------------------
  # Kafka (KRaft, без Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"          # доступ с хоста
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 33554432  # 32 МБ: файлы до 20 МБ в base64
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic documents.extract.tasks --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic documents.extracted --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic documents.failed --partitions 1 --replication-factor 1
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "18081:8080"           # 8081 попадает в excluded port range Windows/Hyper-V
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  text-extractor:
    build: ./TextExtractorService
    container_name: text-extractor
    restart: unless-stopped
    ports:
      - "18000:8000"
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TASKS_TOPIC=documents.extract.tasks
      - KAFKA_TOPIC=documents.extracted
      - KAFKA_DLQ_TOPIC=documents.failed
      - KAFKA_MAX_MESSAGE_BYTES=33554432
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Worker: распознаёт текст из задач Kafka и кладёт его в documents.extracted
  # Масштабируется: docker compose up --scale text-extractor-worker=3
  # ---------------------------------------------------------------------------
  text-extractor-worker:
    build: ./TextExtractorService
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TASKS_TOPIC=documents.extract.tasks
      - KAFKA_TOPIC=documents.extracted
      - KAFKA_DLQ_TOPIC=documents.failed
      - KAFKA_CONSUMER_GROUP=text-extractor-ocr
      - KAFKA_MAX_MESSAGE_BYTES=33554432
      - LOG_LEVEL=INFO
    healthcheck:
      disable: true  # у воркера нет HTTP-порта
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - default

