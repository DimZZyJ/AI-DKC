version: '3.8'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.2:3b &&
      ollama pull nomic-embed-text-v2-moe &&
      ollama pull bge-m3 &&
      ollama pull qwen2.5:7b-instruct &&
      wait
      "

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=yourpassword
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=jszip,mammoth,pdf-parse
      #- PYTHONPATH=/opt/venv/lib/python3.12/site-packages
    volumes:
      - n8n_data:/home/node/.n8n
    
  postgres:
    #image: postgres:17
    image: pgvector/pgvector:pg17
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=88888888
      - POSTGRES_USER=postgres
      - POSTGRES_DB=n8ndb

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    
  text-extractor:
    build: ./TextExtractorService
    container_name: text-extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - default

volumes:
  ollama_data:
  webui_data:
  n8n_data:
  postgres_data: